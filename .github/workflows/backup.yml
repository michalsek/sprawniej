name: Back up the database

# Not switched on yet: it runs only when started by hand (Actions, Back up the database, Run workflow, or
# `gh workflow run backup.yml`). To run it every night, remove the # in front of the two schedule lines below.
# It needs two repository secrets first (Settings, Secrets and variables, Actions):
#   SUPABASE_DB_URL     the session pooler connection string with the database password (Project Settings,
#                       Database, Connect, Session pooler):
#                       postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE   a long random passphrase. The dump is encrypted with it, because anyone signed in to GitHub
#                       can download the artifacts of a public repository. Keep it in a password manager.
# The dump holds the data only (every row of public, private, auth and storage), not the tables themselves: those come
# from supabase/migrations and from Supabase. Restoring means a project with the migrations applied first, then the
# data. Pictures are not in the dump: they stay in the "pictures" bucket and are not backed up yet.
# Restoring is described in docs/supabase-setup.md (Backups); try it once on a throwaway project before relying on it.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 3 * * *'   # every night at 03:17 UTC, after the nightly jobs (02:17 to 02:37)

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17   # pg_dump must be at least the server's version (Postgres 17)
    timeout-minutes: 20
    steps:
      - name: Check the secrets
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Add the repository secrets SUPABASE_DB_URL and BACKUP_PASSPHRASE first (see the top of this file)."
            exit 1
          fi
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # the migrations' own bookkeeping belongs to the new project, so it stays out
          pg_dump "$DATABASE_URL" --data-only \
            --schema=public --schema=private --schema=auth --schema=storage \
            --exclude-table=auth.schema_migrations --exclude-table=storage.migrations \
            --format=custom --file=sprawniej.dump
      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends gnupg > /dev/null
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --output "sprawniej-$(date -u +%F).dump.gpg" sprawniej.dump
          rm sprawniej.dump
      - uses: actions/upload-artifact@v4
        with:
          name: sprawniej-db-${{ github.run_id }}
          path: sprawniej-*.dump.gpg
          retention-days: 30
          if-no-files-found: error

  # One request to the project's API, so a scheduled run also counts as activity
  # (free projects pause after a week without any).
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say hello to the project
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Set the repository variables VITE_SUPABASE_URL and VITE_SUPABASE_KEY first (Settings, Secrets and variables, Actions, Variables)."
            exit 1
          fi
          curl -fsS --max-time 30 "$URL/auth/v1/settings" -H "apikey: $KEY" -o /dev/null
