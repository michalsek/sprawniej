<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <script>
      // light or dark from the very first frame, before anything else loads (src/lib/theme.ts takes over once the
      // app starts; tests/themeScript.test.ts runs this against it)
      ;(function () {
        var choice = 'system'
        try {
          var kept = localStorage.getItem('sprawniej-theme')
          if (kept === 'light' || kept === 'dark') choice = kept
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        if (choice === 'system') return
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', dark ? '#18181b' : '#fafafa')
      })()
    </script>
    <title>Sprawniej</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
